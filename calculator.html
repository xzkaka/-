<!DOCTYPE html>
<html>
<head>
<title>calculator</title>
</head>
<body>
<input id="p" type="text">x<input id="o" type="text">
<button onclick="ADD();">add</button>   <!--按钮里的函数必须和和脚本里的函数名称一样，不然没办法调用-->
<button onclick="DEL();">del</button><br></br>

<table id="t1">
  <tr><th>x</th><th>y</th><th>x*y</th></tr>
</table>
<style>
    input{
        width:120px;height:30px;padding: 0 8px;font-size: 16px;
        border: 2px solid blue;border-radius: 4px;background-color: white;
    }
    input:focus{
        border-color: rgb(86, 72, 216);
    }
    table{border-collapse:collapse;
          text-align: center;}
    th{background-color: rgb(7, 107, 73);padding: 5px 20px;
    border:1.5px solid coral;color:antiquewhite}
    td{background-color: beige;border:1.5px solid skyblue;}
    button{
        padding:6px 12px;font-size: 12px;
    }
</style>

  <script>
    var p=[];
    var o=[];
    function ADD(){
        var x=Number(document.getElementById("p").value);
        var y=Number(document.getElementById("o").value);
        document.getElementById("t1").insertAdjacentHTML("beforeend","<tr><td>"+x+
      "</td><td>"+y+"</td><td>"+(x*y)+"</td><tr>"); 
      p.push(Number(x));
      o.push(Number(y));
  }   
  function DEL(){
    p.pop();
    o.pop();
    document.getElementById("t1").innerHTML="<tr><th>x</th><th>y</th><th>x*y</th><tr>"
      for(var i=0;i<p.length;i++){
        document.getElementById("t1").insertAdjacentHTML("beforeend","<tr><td>"
          +p[i]+"</td><td>"+o[i]+"</td><td>"+(p[i]*o[i])+"</td><tr>");

      }  
    }
  
  </script>
</body>
</html>
