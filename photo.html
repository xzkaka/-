<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Album - Crazy Space</title>
    <style>
        /* 1. 引入与主页相同的个性化字体 */
        @font-face {
            font-family: 'ENG'; 
            src: url('ENG.otf') format('opentype'); 
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fefaf3;
            font-family: 'ENG', "PingFang SC", "STKaiti", cursive, sans-serif;
            color: #5a4b41;
            /* 延续温馨的复古背景底纹 */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23e9d8c8' fill-opacity='0.25' fill-rule='evenodd'/%3E%3C/svg%3E");
            padding: 40px 20px;
        }

        /* 返回首页按钮 */
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #6e5a4e;
            background: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.05);
            font-weight: bold;
            margin-bottom: 40px;
            transition: transform 0.2s ease;
        }
        .back-btn:hover {
            transform: scale(1.05);
        }

        .album-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .album-title {
            font-size: 2rem;
            color: #aa8c74;
            margin-bottom: 30px;
            border-bottom: 2px dashed #e9d8c8;
            padding-bottom: 10px;
        }

        /* 2. 核心：规则的网格布局展示照片 */
        .photo-grid {
            display: grid;
            /* 自动根据屏幕宽度分列，每列最小 280px，自动填满 */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px; /* 照片卡片之间的间距 */
        }

        /* 3. 拍立得照片卡片（规则整齐，不旋转） */
        .polaroid-card {
            background: #fff;
            padding: 15px 15px 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #eee;
            border-radius: 2px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* 鼠标悬停卡片时轻微浮起，增加互动感 */
        .polaroid-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        /* 限制图片容器的高宽比例，防止裂图时排版塌陷（解决老师反馈的隐患） */
        .image-wrapper {
            width: 100%;
            height: 240px; /* 固定图片显示高度 */
            overflow: hidden;
            background: #fcfaf7; /* 裂图时的占位背景色 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 保证图片不变形地填满格子 */
        }

        /* 4. 时间和地点标签样式 */
        .photo-info {
            margin-top: 15px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .photo-meta {
            display: flex;
            justify-content: space-between;
            color: #a08875;
            font-size: 0.8rem;
            border-top: 1px dashed #f0e5da;
            padding-top: 8px;
            margin-top: 8px;
        }

        .photo-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="album-container">
        <a href="index.html" class="back-btn">← Back to Space</a>
        
        <h1 class="album-title">📸 Photo Album Memory</h1>

        <div class="photo-grid">

            <div class="polaroid-card">
                <div class="image-wrapper">
                    <img src="images/view2.jpg" alt="Sea View" loading="lazy">
                </div>
                <div class="photo-info">
                    <p style="font-weight: bold; color: #6e5a4e;">看海的日子</p>
                    <div class="photo-meta">
                        <span>📅 2026/05/10</span>
                        <span>📍 sea</span>
                    </div>
                </div>
            </div>

            <div class="polaroid-card">
                <div class="image-wrapper">
                    <img src="images/noddles2.jpg" alt="Delicious Food" loading="lazy">
                </div>
                <div class="photo-info">
                    <p style="font-weight: bold; color: #6e5a4e;">超满足的深夜面条</p>
                    <div class="photo-meta">
                        <span>📅 2026/05/15</span>
                        <span>📍 首尔 · 美食街</span>
                    </div>
                </div>
            </div>

            <div class="polaroid-card">
                <div class="image-wrapper">
                    <img src="images/sea2.jpg" alt="Journey" loading="lazy">
                </div>
                <div class="photo-info">
                    <p style="font-weight: bold; color: #6e5a4e;">古建筑与晴空</p>
                    <div class="photo-meta">
                        <span>📅 2026/05/19</span>
                        <span>📍 sea</span>
                    </div>
                </div>
            </div>

            <div class="polaroid-card">
                <div class="image-wrapper">
                    <img src="images/view2.jpg" alt="Sample" loading="lazy">
                </div>
                <div class="photo-info">
                    <p style="font-weight: bold; color: #6e5a4e;">樱花盛开的墙角</p>
                    <div class="photo-meta">
                        <span>📅 2026/04/05</span>
                        <span>📍 校园的一角</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
