<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily - Crazy Space</title>
    <style>
        /* 1. 字体配置 (直接引用根目录文件) */
        @font-face {
            font-family: 'bold'; 
            src: url('bold.ttf') format('truetype'); /* */
        }

        body {
            background: #fefaf3;
            font-family: 'bold', "STKaiti", sans-serif !important;
            color: #5a4b41;
            margin: 0;
            padding: 20px;
            /* 复古背景底纹 */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' .../%3E");
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            text-decoration: none;
            background: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            color: #6e5a4e;
        }

        /* 2. 手账画布区：模仿主页的不规则感 */
        .sub-canvas {
            max-width: 1000px;
            margin: 80px auto;
            position: relative;
            min-height: 1200px; /* 给内容留足空间 */
        }

        /* 图片通用样式：增加相纸边框 */
        .photo-frame {
            position: absolute;
            background: #fff;
            padding: 10px 10px 30px 10px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.1);
            border: 1px solid #eee;
        }

        /* 具体的图片摆放位置 */
        .img-1 { top: 50px; left: 50px; transform: rotate(-3deg); width: 300px; }
        .img-2 { top: 400px; right: 50px; transform: rotate(2deg); width: 350px; }

        /* 3. 文字便签区域 */
        .diary-note {
            position: absolute;
            top: 150px;
            right: 100px;
            width: 300px;
            background: #fffdf3;
            padding: 30px;
            transform: rotate(1deg);
            line-height: 1.8;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.05);
            /* 模拟横线 */
            background-image: linear-gradient(#e8e3cf 1px, transparent 1px);
            background-size: 100% 28px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">← Back</a>

    <div class="sub-canvas">
        <div class="photo-frame img-1">
            <img src="images/noddles2.jpg" style="width:100%">
            <p style="text-align:center; margin-top:10px;">I will still want to eat...</p>
        </div>

        <div class="diary-note">
            <h3>May 19, 2026</h3>
            <p>I ate delicious fried squid Daoxiao Noodles today</p>
        </div>

        <div class="photo-frame img-2">
            <img src="bread.jpg" style="width:100%">
            <p style="text-align:center; margin-top:10px;">Favorite Bread</p>
        </div>
    </div>

</body>
</html>
